[workspace]
members = [
  "crates/libneo",
  "crates/libneo-gpui",
  "tests/workspace-checks",
  "vendor/ztracing",
]
exclude = ["vendor/block"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
authors = ["ACTUAL LTD."]
repository = "https://github.com/superneoai/libneo"
license = "MIT OR Apache-2.0"
publish = false

# Replace GPUI's `ztracing` package with the permissive compatibility crate.
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "vendor/ztracing" }

# Use the crates.io font-kit package required by the pinned Zed revision.
[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { version = "=0.14.1-zed" }

# Fix block 0.1.6's uninhabited FFI static type.
[patch.crates-io]
block = { path = "vendor/block" }
