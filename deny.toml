# cargo-deny checks all dependency licenses, advisories, bans, and sources.
# Run `cargo deny --locked check` before a release.

[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "bzip2-1.0.6",
  "Unlicense",
  "Zlib",
]
# Copyleft licenses, including every GPL variant, are intentionally omitted.

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Review by 2026-11-21: paste 1.0.15 is a compile-time macro dependency through metal and pulp; this is an unmaintained notice, not a vulnerability, no patched release exists, and current Zed main still resolves it" },
  { id = "RUSTSEC-2026-0192", reason = "Review by 2026-11-21: ttf-parser 0.25.1 is runtime-reachable through GPUI text and font parsing; this is an unmaintained notice, not a vulnerability, no patched release exists, and current Zed main still pins 0.25" },
  { id = "RUSTSEC-2026-0206", reason = "Review by 2026-11-21: rustybuzz 0.20.1 is behind GPUI SVG rendering, which libneo does not invoke internally; this is an unmaintained notice, not a vulnerability, no patched release exists, and current Zed main still resolves it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/zed-industries/zed"]
