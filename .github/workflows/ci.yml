name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Format
        run: cargo fmt --all --check
      - name: Verify facade dependency isolation
        run: |
          tree_file=$(mktemp)
          cargo tree -p libneo --no-default-features --locked > "$tree_file"
          cat "$tree_file"
          if [ "$(wc -l < "$tree_file" | tr -d ' ')" -ne 1 ]; then
            echo "the default libneo facade must have no dependencies" >&2
            exit 1
          fi
      - name: Verify GPUI feature graph
        run: |
          tree_file=$(mktemp)
          cargo tree -p libneo --features gpui --locked > "$tree_file"
          cat "$tree_file"
          grep -F "libneo-gpui v0.1.0-alpha.1" "$tree_file"
      - name: Build
        run: cargo build --workspace --locked
      - name: Check
        run: |
          cargo check --workspace --locked
          cargo check -p libneo --features gpui --locked
      - name: Check x86_64
        run: |
          cargo check --workspace --locked --target x86_64-apple-darwin
          cargo check -p libneo --features gpui --locked --target x86_64-apple-darwin
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p libneo --all-targets --features gpui --locked -- -D warnings
      - name: Test
        run: |
          cargo test --workspace --locked
          cargo test -p libneo --features gpui --locked
      - name: Test the patched block crate
        run: cargo test --manifest-path vendor/block/Cargo.toml
      - name: Document
        run: |
          cargo doc --workspace --no-deps --locked
          cargo doc -p libneo --features gpui --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
      - name: Verify the SDK
        run: |
          test "$(xcrun --show-sdk-version | cut -d. -f1)" -ge 26

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          arguments: --locked
          command: check
